name: Build cross-platform binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test -race ./...

      - name: Build all platforms
        run: make build

      - name: Package binaries
        run: |
          mkdir -p release
          tar -C dist -czf release/clash-guardian-darwin-arm64.tar.gz clash-guardian-darwin-arm64
          tar -C dist -czf release/clash-guardian-darwin-amd64.tar.gz clash-guardian-darwin-amd64
          tar -C dist -czf release/clash-guardian-linux-arm64.tar.gz clash-guardian-linux-arm64
          tar -C dist -czf release/clash-guardian-linux-amd64.tar.gz clash-guardian-linux-amd64
          zip -j release/clash-guardian-windows-amd64.zip dist/clash-guardian-windows-amd64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: clash-guardian-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

